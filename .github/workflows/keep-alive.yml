name: Keep alive

# Der kostenlose Supabase-Plan pausiert Projekte nach etwa einer Woche ohne Zugriff.
# Dieser Abruf läuft alle 3 Tage und hält das Projekt wach (nur der öffentliche Schlüssel, keine Daten).
on:
  schedule:
    - cron: "17 5 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase anpingen
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL/rest/v1/app_meta?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "Antwort: $code"
          # Ohne Anmeldung verweigert die Datenbank den Zugriff (401) - das ist gewollt und zeigt, dass sie antwortet.
          # Pausiert oder nicht erreichbar waere ein anderer Code (z. B. 000 oder 5xx).
          case "$code" in 200|401|403) ;; *) echo "Supabase antwortet nicht wie erwartet"; exit 1 ;; esac
