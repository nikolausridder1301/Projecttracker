name: Keep alive

# Der kostenlose Supabase-Plan pausiert Projekte nach etwa einer Woche ohne Aktivität.
# Dieser Abruf läuft alle 2 Tage und macht eine echte Datenbankabfrage (Funktion keep_alive, liefert nur die Uhrzeit).
on:
  schedule:
    - cron: "17 5 */2 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase anpingen
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /tmp/antwort -w "%{http_code}" -X POST "$SUPABASE_URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "content-type: application/json" -d '{}')
          echo "Antwort: $code $(cat /tmp/antwort)"
          # Nur eine erfolgreiche Abfrage zählt als Aktivität
          [ "$code" = "200" ] || { echo "Supabase antwortet nicht wie erwartet (pausiert?)"; exit 1; }
