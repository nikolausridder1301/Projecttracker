# Hält das kostenlose Supabase-Projekt wach (pausiert sonst nach 7 Tagen
# ohne Aktivität), SPEC.md 7.3. Ruft nur die Funktion ping() auf – liest keine Daten.
name: Supabase Keep-alive

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping()
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          test -n "$URL" || { echo "Repository-Variable SUPABASE_URL fehlt"; exit 1; }
          curl --fail --silent --show-error -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
